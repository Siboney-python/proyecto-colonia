{% extends "base.html" %}

{% block titulo %}Asignar responsable — GestiCat{% endblock %}

{% block contenido %}
<h2>Asignar responsable</h2>

{% if error %}
<p style="color: red"><strong>Error:</strong> {{ error }}</p>
{% endif %}

<form method="post" action="{{ url_for('asignar_responsable') }}">
    <label>Tipo:
        <select name="tipo" id="tipo">
            <option value="persona" {{ 'selected' if datos.tipo == 'persona' }}>Persona física</option>
            <option value="protectora" {{ 'selected' if datos.tipo == 'protectora' }}>Protectora</option>
        </select>
    </label><br>
    <label>Nombre:
        <input type="text" name="nombre" value="{{ datos.nombre or '' }}" required>
    </label><br>
    <label>Teléfono:
        <input type="text" name="telefono" value="{{ datos.telefono or '' }}" required>
    </label><br>
    <label>Email:
        <input type="text" name="email" value="{{ datos.email or '' }}" required>
    </label><br>
    <label>Identificación (DNI/NIF/CIF):
        <input type="text" name="identificacion" value="{{ datos.identificacion or '' }}" required>
    </label><br>
    <label id="campo-extra-label">Fecha de nacimiento (dd/mm/aaaa) / Número de registro:
        <input type="text" name="campo_extra" value="{{ datos.campo_extra or '' }}" required>
    </label><br>
    <button type="submit">Asignar</button>
</form>
<p><a href="{{ url_for('reporte_colonia') }}">← Cancelar y volver</a></p>
{% endblock %}
