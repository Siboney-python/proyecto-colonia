{% extends "base.html" %}

{% block titulo %}Error {{ codigo }} — GestiCat{% endblock %}

{% block contenido %}
<h2>Error {{ codigo }}</h2>
<img src="{{ url_for('static', filename=codigo ~ '.jpg') }}" 
     alt="Error {{ codigo }}" width="400">
<br>
<p>{{ mensaje }}</p>
<p><a href="{{ url_for('inicio') }}">← Volver al inicio</a></p>
{% endblock %}
